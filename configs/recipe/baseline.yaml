# @package recipe
# Phase-2 action-only baseline: no future loss, stored features, no dropout, no augmentation.
name: baseline
predict_future: false
online_obs_encoder: false
augment: false
camera_dropout: 0.0
text_dropout: 0.0
proprio_dropout: 0.0
ema_decay: 0.9999
tau_ctx: 0.0
num_inference_steps: 10
execute_steps: 10
noise_scale: 1.0
lora_blocks: 0
lora:
  enabled: false
  rank: 16
  alpha: 32
  dropout: 0.05
  lr: 1.0e-4
